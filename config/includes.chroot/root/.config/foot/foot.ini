# ==============================================================================
# BriskOS Foot Terminal Configuration
# Night Glass Design System: High-performance Wayland terminal
# JetBrains Mono 11pt typography, 24-bit TrueColor support,
# alpha=0.94 on #0b1120 midnight floor, steady Ice Cyan (#38bdf8) beam cursor.
# ==============================================================================

[main]
term=xterm-256color
font=JetBrains Mono:size=11,Inter:size=11,monospace:size=11
font-bold=JetBrains Mono:weight=bold:size=11,monospace:weight=bold:size=11
font-italic=JetBrains Mono:slant=italic:size=11,monospace:slant=italic:size=11
font-bold-italic=JetBrains Mono:weight=bold:slant=italic:size=11,monospace:weight=bold:slant=italic:size=11
line-height=1.2
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
pad=8x8 center
dpi-aware=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=no
color=0b1120 38bdf8

[mouse]
hide-when-typing=yes

[colors]
alpha=0.94
foreground=f8fafc
background=0b1120

## Normal / Regular colors (0-7) - Harmonized with #0b1120 floor & #0f172a surface
regular0=1e293b
regular1=f43f5e
regular2=34d399
regular3=fbbf24
regular4=38bdf8
regular5=a78bfa
regular6=22d3ee
regular7=e2e8f0

## Bright colors (8-15) - High legibility, contrast > 4.5:1
bright0=475569
bright1=fb7185
bright2=4ade80
bright3=fde047
bright4=60a5fa
bright5=c084fc
bright6=67e8f9
bright7=ffffff

## Selection colors
selection-foreground=0b1120
selection-background=38bdf8

## Search colors
search-box-no-match=0b1120 f43f5e
search-box-match=0b1120 38bdf8

## URL and highlight colors
urls=38bdf8

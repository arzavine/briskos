# ==============================================================================
# BriskOS Foot Terminal Configuration (root)
# Morning Breeze Dark Slate Terminal: High-contrast Wayland terminal
# JetBrains Mono 11pt typography, natural font metrics, #18202b dark slate floor
# with #f1f5f9 frost text (14.97:1 WCAG AAA) and cerulean-teal accents.
# ==============================================================================

[main]
term=xterm-256color
font=JetBrains Mono:size=11,Liberation Mono:size=11,monospace:size=11
font-bold=JetBrains Mono:weight=bold:size=11,Liberation Mono:weight=bold:size=11,monospace:weight=bold:size=11
font-italic=JetBrains Mono:slant=italic:size=11,Liberation Mono:slant=italic:size=11,monospace:slant=italic:size=11
font-bold-italic=JetBrains Mono:weight=bold:slant=italic:size=11,Liberation Mono:weight=bold:slant=italic:size=11,monospace:weight=bold:slant=italic:size=11
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
initial-window-size-chars=92x26
pad=10x10 center
dpi-aware=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=no
color=18202b 38bdf8

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
foreground=f1f5f9
background=18202b

## Normal / Regular colors (0-7) - Morning Breeze Slate & Cerulean-Teal
regular0=1e293b
regular1=f87171
regular2=34d399
regular3=fbbf24
regular4=38bdf8
regular5=d494b8
regular6=2dd4bf
regular7=e2e8f0

## Bright colors (8-15) - WCAG AA verified (>4.5:1 against #18202b)
bright0=78889b
bright1=fca5a5
bright2=6ee7b7
bright3=fde047
bright4=7dd3fc
bright5=e9b8d4
bright6=67e8f9
bright7=ffffff

## Selection colors
selection-foreground=f1f5f9
selection-background=0e7490

## Search colors
search-box-no-match=18202b f87171
search-box-match=18202b 38bdf8

## URL and highlight colors
urls=38bdf8

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>BriskOS Microsoft Office Metric-Compatible Font Substitutions</description>

  <!--
    Ensures .docx, .xlsx, and .pptx documents preserve exact layout, line wraps,
    and cell metrics without requiring proprietary Microsoft font licenses.
  -->

  <!-- Calibri -> Carlito (1:1 exact metric match) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Calibri</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Carlito</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>

  <!-- Cambria -> Caladea (1:1 exact metric match) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Cambria</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Caladea</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Cambria</family>
    <prefer>
      <family>Caladea</family>
    </prefer>
  </alias>

  <!-- Arial -> Liberation Sans / Arial -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Arial</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Liberation Sans</string>
      <string>Arial</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Arial</family>
    </prefer>
  </alias>

  <!-- Times New Roman -> Liberation Serif / Times New Roman -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Liberation Serif</string>
      <string>Times New Roman</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Times New Roman</family>
    </prefer>
  </alias>

  <!-- Courier New -> Liberation Mono / Courier New -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Courier New</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Liberation Mono</string>
      <string>Courier New</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Courier New</family>
    <prefer>
      <family>Liberation Mono</family>
      <family>Courier New</family>
    </prefer>
  </alias>

  <!-- Aptos -> Carlito / Inter (Modern Microsoft 365 default font fallback) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Aptos</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Carlito</string>
      <string>Inter</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Aptos</family>
    <prefer>
      <family>Carlito</family>
      <family>Inter</family>
    </prefer>
  </alias>

  <!-- Segoe UI -> Inter (Windows modern UI font fallback) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Segoe UI</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Inter</string>
    </edit>
  </match>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

</fontconfig>

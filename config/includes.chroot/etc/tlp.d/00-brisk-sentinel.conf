# ==============================================================================
# Brisk Battery Sentinel - TLP Power Optimization Profile
# Drop-in configuration for modern Intel, AMD, and NVidia laptops
# ==============================================================================

# Enable TLP daemon management
TLP_ENABLE=1
TLP_WARN_LEVEL=3

# ------------------------------------------------------------------------------
# CPU Frequency Scaling & Energy Performance Preferences (EPP)
# ------------------------------------------------------------------------------
# AC: Peak responsiveness and throughput
# BAT: Dynamic aggressive efficiency, low thermal output, and prolonged battery life
CPU_SCALING_GOVERNOR_ON_AC="performance"
CPU_SCALING_GOVERNOR_ON_BAT="powersave"

CPU_ENERGY_PERF_POLICY_ON_AC="performance"
CPU_ENERGY_PERF_POLICY_ON_BAT="balance_power"

# Intel / AMD P-State Frequency limits (percent)
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80

# Turbo Boost behavior
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# ------------------------------------------------------------------------------
# Bus & Peripheral Power Management (PCIe ASPM, USB, Audio, Wi-Fi)
# ------------------------------------------------------------------------------
# Active State Power Management for PCIe lanes
PCIE_ASPM_ON_AC="default"
PCIE_ASPM_ON_BAT="powersupersave"

# Audio chip power-saving timeout (seconds)
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Wi-Fi Power Savings mode (802.11 power save protocol)
WIFI_PWR_ON_AC="off"
WIFI_PWR_ON_BAT="on"

# Runtime Power Management for PCI(e) bus devices
RUNTIME_PM_ON_AC="on"
RUNTIME_PM_ON_BAT="auto"

# USB auto-suspend for idle peripherals
USB_AUTOSUSPEND=1

# ------------------------------------------------------------------------------
# Storage Devices & NVMe/SATA Power State
# ------------------------------------------------------------------------------
DISK_DEVICES="nvme0n1 sda"
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128"
DISK_SPINDOWN_TIMEOUT_ON_BAT="12"

# SATA Link Power Management (AHCI/NVMe)
SATA_LINKPWR_ON_AC="med_power_with_dipm max_performance"
SATA_LINKPWR_ON_BAT="min_power"

# AHCI Host Controller Interface Power Management
AHCI_RUNTIME_PM_ON_AC="on"
AHCI_RUNTIME_PM_ON_BAT="auto"

# ------------------------------------------------------------------------------
# Battery Lifespan Preservation (Charge Ceilings)
# Limits wear on Li-Ion cells by keeping stop charge at 80%
# ------------------------------------------------------------------------------
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_BAT=1

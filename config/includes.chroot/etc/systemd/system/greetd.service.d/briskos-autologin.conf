# BriskOS 1.0 LTS - greetd startup ordering and live/installed fallback
# Ensures live-config finishes creating the live 'user' account before greetd
# starts, binds cleanly to VT 7 without colliding with getty@tty1, and omits
# [initial_session] at runtime on installed systems where 'user' is deleted.

[Unit]
After=systemd-user-sessions.service live-config.service plymouth-quit-wait.service getty@tty7.service
Conflicts=getty@tty7.service

[Service]
ExecStartPre=/bin/sh -c 'if grep -qs "boot=live" /proc/cmdline; then i=0; while [ "$i" -lt 40 ] && ! id -u user >/dev/null 2>&1; do sleep 0.25; i=$((i + 1)); done; fi'
ExecStartPre=/bin/sh -c 'mkdir -p /run/greetd && if id -u user >/dev/null 2>&1; then cp /etc/greetd/config.toml /run/greetd/config.toml; else sed "/^.initial_session.$/Q" /etc/greetd/config.toml > /run/greetd/config.toml; fi'
ExecStartPre=-/bin/sh -c 'command -v chvt >/dev/null 2>&1 && chvt 7 || true'
ExecStart=
ExecStart=/bin/sh -c 'PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"; exec "$(command -v greetd)" --config /run/greetd/config.toml'

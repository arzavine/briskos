# ==============================================================================
# BriskOS Foot Terminal Configuration
# High-performance Wayland terminal with Slate & Brisk Ice Cyan palette
# ==============================================================================

[main]
term=xterm-256color
font=monospace:size=11
font-bold=monospace:weight=bold:size=11
font-italic=monospace:slant=italic:size=11
font-bold-italic=monospace:weight=bold:slant=italic:size=11
line-height=1.2
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
pad=8x8 center
dpi-aware=yes

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=percentage

[cursor]
style=beam
blink=yes
color=0f172a 38bdf8

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
foreground=f8fafc
background=0f172a

## Normal / Regular colors (0-7)
regular0=1e293b
regular1=f87171
regular2=34d399
regular3=fbbf24
regular4=38bdf8
regular5=c084fc
regular6=22d3ee
regular7=e2e8f0

## Bright colors (8-15)
bright0=475569
bright1=ef4444
bright2=10b981
bright3=f59e0b
bright4=60a5fa
bright5=a855f7
bright6=06b6d4
bright7=ffffff

## Selection colors
selection-foreground=0f172a
selection-background=38bdf8

## Search colors
search-box-no-match=0f172a f87171
search-box-match=0f172a 38bdf8

## URL and highlight colors
urls=38bdf8

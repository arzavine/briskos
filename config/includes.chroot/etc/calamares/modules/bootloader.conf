# Calamares bootloader module configuration for BriskOS 1.0 LTS
# Installs and registers the GRUB bootloader on EFI and BIOS systems
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubTarget: "x86_64-efi"
efiBootLoaderId: "briskos"
installPath: "/boot/efi"
grubCfgPath: "/boot/grub/grub.cfg"
installEpilogue: true

# Calamares welcome module configuration for BriskOS 1.0 LTS
# Validates minimum hardware requirements before initiating installation
---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # Storage in GiB
    requiredStorage:    10.0
    # RAM in GiB
    requiredRam:        1.0
    # Items checked during pre-install validation
    check:
        - storage
        - ram
        - power
        - internet
        - root
    # Items strictly required to proceed with installation
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"

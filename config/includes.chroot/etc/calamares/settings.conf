# Calamares settings for BriskOS 1.0 LTS (Feather)
# Defines the module installation sequence and global branding parameters
---
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules
  - /usr/lib/calamares/modules
  - /usr/share/calamares/modules

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - packages
      - umount
  - show:
      - finished

branding: briskos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false

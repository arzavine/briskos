<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <linearGradient id="featherPrimary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C96AD"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0C5B73"/>
    </linearGradient>
    <linearGradient id="featherMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EC8D9"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="featherBase" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#094D61"/>
    </linearGradient>
  </defs>

  <!-- Morning Breeze Light Surface Card -->
  <rect x="0" y="0" width="720" height="320" rx="12" fill="#FFFFFF"/>
  <rect x="1" y="1" width="718" height="318" rx="11" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left Ice Mist Accent Panel -->
  <path d="M 12 1 L 256 1 L 214 319 L 12 319 C 5.9 319 1 314.1 1 308 L 1 12 C 1 5.9 5.9 1 12 1 Z"
        fill="#E9F1F4"/>
  <line x1="256" y1="1" x2="214" y2="319" stroke="#D5E2E7" stroke-width="1.5"/>

  <!-- Subtle Breeze Horizon Sweep -->
  <path d="M 12 248 C 96 226, 178 214, 240 184"
        fill="none" stroke="#0E7490" stroke-width="2" stroke-opacity="0.16" stroke-linecap="round"/>

  <!-- Left: BriskOS Morning Breeze Feather Emblem -->
  <g transform="translate(24, 52) scale(0.42)">
    <circle cx="256" cy="256" r="224" fill="#D6E9EE" stroke="#CBD5E1" stroke-width="2.5"/>
    <path d="M 128 396 C 174 386, 238 358, 298 308 L 256 290 C 200 330, 154 364, 128 396 Z"
          fill="url(#featherBase)"/>
    <path d="M 170 352 C 232 318, 314 268, 370 202 L 318 188 C 262 240, 198 300, 170 352 Z"
          fill="url(#featherMid)"/>
    <path d="M 102 414 C 158 366, 260 256, 428 84 C 406 142, 358 262, 278 336 C 218 392, 142 418, 102 414 Z"
          fill="url(#featherPrimary)"/>
    <line x1="278" y1="210" x2="342" y2="242" stroke="#D6E9EE" stroke-width="6" stroke-linecap="round"/>
    <line x1="222" y1="266" x2="278" y2="298" stroke="#D6E9EE" stroke-width="6" stroke-linecap="round"/>
    <line x1="168" y1="330" x2="212" y2="356" stroke="#D6E9EE" stroke-width="6" stroke-linecap="round"/>
    <path d="M 88 426 C 154 370, 274 248, 444 70"
          fill="none" stroke="#094D61" stroke-width="9" stroke-linecap="round"/>
    <circle cx="444" cy="70" r="6" fill="#0E7490"/>
  </g>

  <!-- Right: Clear Product Identity & Verified Feature Summary -->
  <g transform="translate(278, 56)">
    <text x="0" y="18" font-family="'Inter', 'Noto Sans', 'Cantarell', sans-serif"
          font-size="12" font-weight="700" fill="#0C5B73" letter-spacing="0.8">BRISKOS 1.0 LTS (FEATHER)</text>

    <text x="0" y="68" font-family="'Inter', 'Noto Sans', 'Cantarell', sans-serif"
          font-size="40" font-weight="800" fill="#0F172A" letter-spacing="-0.5">BriskOS</text>

    <text x="0" y="98" font-family="'Inter', 'Noto Sans', 'Cantarell', sans-serif"
          font-size="15" font-weight="500" fill="#475569">Fast, lightweight desktop built on Debian 13 (Trixie).</text>

    <!-- Feature Item 1: Wayland Desktop -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="406" height="32" rx="8" fill="#F5F7F7" stroke="#CBD5E1" stroke-width="1"/>
      <g transform="translate(10, 8)" fill="none" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="1" width="14" height="10" rx="2"/>
        <line x1="5" y1="15" x2="11" y2="15"/>
        <line x1="8" y1="11" x2="8" y2="15"/>
      </g>
      <text x="36" y="21" font-family="'Inter', 'Noto Sans', sans-serif"
            font-size="12" font-weight="600" fill="#0F172A">Labwc Wayland Desktop &amp; Hardware Control Center</text>
    </g>

    <!-- Feature Item 2: System Snapshots -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="406" height="32" rx="8" fill="#F5F7F7" stroke="#CBD5E1" stroke-width="1"/>
      <g transform="translate(10, 8)" fill="none" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 2 8 A 6 6 0 1 1 4 12.2"/>
        <polyline points="2 4 2 8 6 8"/>
        <polyline points="8 5 8 8 10.5 9.5"/>
      </g>
      <text x="36" y="21" font-family="'Inter', 'Noto Sans', sans-serif"
            font-size="12" font-weight="600" fill="#0F172A">Time-Travel Checkpoints &amp; Battery Sentinel</text>
    </g>

    <!-- Feature Item 3: Wine Windows App Support -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="406" height="32" rx="8" fill="#F5F7F7" stroke="#CBD5E1" stroke-width="1"/>
      <g transform="translate(10, 8)" fill="none" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/>
        <rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/>
        <rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/>
        <rect x="9" y="9" width="5.5" height="5.5" rx="1"/>
      </g>
      <text x="36" y="21" font-family="'Inter', 'Noto Sans', sans-serif"
            font-size="12" font-weight="600" fill="#0F172A">Wine Windows App Support &amp; Brisk Store</text>
    </g>
  </g>
</svg>

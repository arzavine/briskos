<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Morning Breeze Cerulean Feather Identity -->
    <linearGradient id="featherPrimary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3C96AD"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0C5B73"/>
    </linearGradient>
    <linearGradient id="featherMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EC8D9"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="featherBase" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#094D61"/>
    </linearGradient>
  </defs>

  <!-- Soft Morning Breeze Backdrop Circle -->
  <circle cx="256" cy="256" r="224" fill="#D6E9EE" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Subtle Geometric Breeze Arcs -->
  <path d="M 76 382 C 164 352, 294 246, 418 96"
        fill="none" stroke="#0E7490" stroke-width="3" stroke-opacity="0.18" stroke-linecap="round"/>
  <path d="M 110 420 C 198 390, 328 284, 440 136"
        fill="none" stroke="#0E7490" stroke-width="2" stroke-opacity="0.12" stroke-linecap="round"/>

  <!-- Lower Trailing Vane -->
  <path d="M 128 396 C 174 386, 238 358, 298 308 L 256 290 C 200 330, 154 364, 128 396 Z"
        fill="url(#featherBase)"/>

  <!-- Mid Compression Vane -->
  <path d="M 170 352 C 232 318, 314 268, 370 202 L 318 188 C 262 240, 198 300, 170 352 Z"
        fill="url(#featherMid)"/>

  <!-- Primary Swept Feather Wing -->
  <path d="M 102 414 C 158 366, 260 256, 428 84 C 406 142, 358 262, 278 336 C 218 392, 142 418, 102 414 Z"
        fill="url(#featherPrimary)"/>

  <!-- Clean Vane Notches -->
  <line x1="278" y1="210" x2="342" y2="242" stroke="#D6E9EE" stroke-width="5" stroke-linecap="round"/>
  <line x1="222" y1="266" x2="278" y2="298" stroke="#D6E9EE" stroke-width="5" stroke-linecap="round"/>
  <line x1="168" y1="330" x2="212" y2="356" stroke="#D6E9EE" stroke-width="5" stroke-linecap="round"/>

  <!-- Feather Quill Spine -->
  <path d="M 88 426 C 154 370, 274 248, 444 70"
        fill="none" stroke="#094D61" stroke-width="8" stroke-linecap="round"/>
  <circle cx="444" cy="70" r="6" fill="#0E7490"/>
</svg>

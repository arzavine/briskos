# ==============================================================================
# BriskOS Time-Travel Instant System Snapshot Configuration
# ==============================================================================

# Enable or disable automatic snapshot creation prior to APT package operations
AUTO_BACKUP_ENABLED=true

# Maximum number of automated snapshots to retain before pruning oldest
MAX_SNAPSHOTS=10

# Base directory for snapshot and metadata storage
BACKUP_DIR="/var/backups/brisk-timetravel/snapshots"

# Snapshot engine backend: auto (btrfs if available, otherwise rsync hardlinks), btrfs, or rsync
SNAPSHOT_TYPE="auto"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Base Floor Gradient: Deep Midnight Slate (#0b1120) with subtle peripheral depth -->
    <linearGradient id="baseFloorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Luminous Ambient Field: Single soft cyan light source low on the right/center -->
    <!-- Positioned to give floating glass taskbar islands and windows an atmospheric glow plane -->
    <radialGradient id="luminousAmbient" cx="64%" cy="68%" r="58%" fx="64%" fy="68%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.025"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.006"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Soft Core Diffusion to prevent any banding -->
    <radialGradient id="coreAmbientBloom" cx="60%" cy="72%" r="28%" fx="60%" fy="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>

    <!-- Supersonic Geometric Facet Gradients (Deep Slate Flow Surfaces) -->
    <linearGradient id="facetGradA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="facetGradB" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#162236" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="facetGradC" x1="100%" y1="80%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#0a0f1d" stop-opacity="0.50"/>
      <stop offset="60%" stop-color="#131e33" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Aerodynamic Streamline Gradients -->
    <linearGradient id="streamlineGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.09"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streamlineGradSubtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Floor Layer (Deep midnight slate #0b1120) -->
  <rect width="1920" height="1080" fill="url(#baseFloorGrad)"/>

  <!-- 2. Luminous Ambient Field (Single soft cyan light source low on right/center) -->
  <rect width="1920" height="1080" fill="url(#luminousAmbient)"/>
  <rect width="1920" height="1080" fill="url(#coreAmbientBloom)"/>

  <!-- 3. Minimalist Aerodynamic Contours & Supersonic Geometric Facets -->
  <!-- Lower sweeping supersonic keel plane -->
  <polygon points="-80,1080 500,760 1320,830 2000,1080" 
           fill="url(#facetGradC)" 
           stroke="#38bdf8" 
           stroke-opacity="0.05" 
           stroke-width="1"/>

  <!-- Main sweeping supersonic delta wedge -->
  <polygon points="-60,680 660,510 1440,490 2000,320 1880,590 1280,730 480,780 -60,920" 
           fill="url(#facetGradA)" 
           stroke="#38bdf8" 
           stroke-opacity="0.08" 
           stroke-width="1"/>

  <!-- Upper transonic flow facet -->
  <polygon points="160,0 840,340 1640,280 2020,130 2020,0" 
           fill="url(#facetGradB)" 
           stroke="#38bdf8" 
           stroke-opacity="0.06" 
           stroke-width="1"/>

  <!-- Mid-chord compression facet -->
  <polygon points="480,780 660,510 1440,490 1280,730" 
           fill="#1e293b" 
           fill-opacity="0.12" 
           stroke="#38bdf8" 
           stroke-opacity="0.10" 
           stroke-width="1"/>

  <!-- Forward supersonic chine line -->
  <polygon points="-40,520 660,510 1160,410 1820,260 1440,490" 
           fill="#0f172a" 
           fill-opacity="0.20" 
           stroke="#38bdf8" 
           stroke-opacity="0.09" 
           stroke-width="1"/>

  <!-- 4. Aerodynamic Streamlines & Vector Flow Contours -->
  <!-- Primary supersonic chord streamline -->
  <path d="M -40 560 C 440 600, 860 480, 1360 450 S 1800 350, 2000 310" 
        fill="none" 
        stroke="url(#streamlineGradCyan)" 
        stroke-width="1.2"/>

  <!-- Secondary boundary layer streamline -->
  <path d="M -40 600 C 460 640, 890 520, 1390 484 S 1830 384, 2000 348" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-opacity="0.07" 
        stroke-width="1"/>

  <!-- Tertiary laminar flow contour -->
  <path d="M 120 680 C 580 700, 960 590, 1440 550 S 1860 460, 2000 430" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-opacity="0.05" 
        stroke-width="1"/>

  <!-- High-altitude transonic flow line -->
  <path d="M 240 240 C 700 300, 1120 220, 1600 190 S 1920 140, 2020 120" 
        fill="none" 
        stroke="url(#streamlineGradSubtle)" 
        stroke-width="1"/>

  <!-- Supersonic Mach vector lines -->
  <line x1="660" y1="510" x2="1440" y2="490" 
        stroke="#38bdf8" 
        stroke-opacity="0.11" 
        stroke-width="1"/>

  <line x1="840" y1="340" x2="1640" y2="280" 
        stroke="#38bdf8" 
        stroke-opacity="0.07" 
        stroke-width="1"/>

  <line x1="500" y1="760" x2="1280" y2="730" 
        stroke="#38bdf8" 
        stroke-opacity="0.06" 
        stroke-width="1"/>

  <!-- Subtle lower atmospheric horizon guide line -->
  <path d="M 80 970 C 600 950, 1180 960, 1840 940" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-opacity="0.04" 
        stroke-width="1"/>
</svg>

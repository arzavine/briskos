<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Serene daylight sky gradient: warm porcelain to crisp mist blue -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f5f7f7" />
      <stop offset="48%" stop-color="#e9f1f4" />
      <stop offset="82%" stop-color="#dcecf2" />
      <stop offset="100%" stop-color="#c6e2ec" />
    </linearGradient>

    <!-- Soft upper mist veil -->
    <linearGradient id="upperSilk" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="55%" stop-color="#e9f1f4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#b8dce8" stop-opacity="0.22" />
    </linearGradient>

    <!-- Mid-horizon morning mist silk -->
    <linearGradient id="midSilk" x1="15%" y1="100%" x2="95%" y2="15%">
      <stop offset="0%" stop-color="#b8dce8" stop-opacity="0.78" />
      <stop offset="55%" stop-color="#cce5ee" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#e9f1f4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Foreground calm cerulean horizon sweep -->
    <linearGradient id="horizonSilk" x1="0%" y1="20%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#5da3b8" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#28859e" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#1b7a94" stop-opacity="0.62" />
    </linearGradient>

    <!-- Lower deepest silk fold along bottom edge -->
    <linearGradient id="deepHorizon" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1b7a94" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#0e7490" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0c5b73" stop-opacity="0.52" />
    </linearGradient>

    <!-- Delicate highlight crest along the main silk fold -->
    <linearGradient id="silkCrest" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="72%" stop-color="#f5f7f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Base daylight canvas -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Broad porcelain upper sweep -->
  <path d="M 0,0 L 1920,0 L 1920,420 C 1540,560 1120,260 660,410 C 360,508 160,460 0,340 Z"
        fill="url(#upperSilk)" />

  <!-- Soft descending breeze layer -->
  <path d="M 0,490 C 320,390 690,590 1120,470 C 1460,375 1720,430 1920,515 L 1920,1080 L 0,1080 Z"
        fill="url(#midSilk)" />

  <!-- Secondary mist crest -->
  <path d="M 0,635 C 380,745 780,535 1230,615 C 1540,670 1760,575 1920,545 L 1920,1080 L 0,1080 Z"
        fill="#b8dce8" fill-opacity="0.46" />

  <!-- Luminous highlight edge along upper horizon silk -->
  <path d="M 0,635 C 380,745 780,535 1230,615 C 1540,670 1760,575 1920,545"
        fill="none" stroke="url(#silkCrest)" stroke-width="3" />

  <!-- Calm cerulean horizon fold -->
  <path d="M 0,780 C 420,685 830,860 1280,750 C 1570,680 1780,730 1920,795 L 1920,1080 L 0,1080 Z"
        fill="url(#horizonSilk)" />

  <!-- Deep cerulean base fold anchoring the bottom panel -->
  <path d="M 0,920 C 460,995 980,825 1480,910 C 1690,946 1820,915 1920,885 L 1920,1080 L 0,1080 Z"
        fill="url(#deepHorizon)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ctrlSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e9f1f4" />
    </linearGradient>
  </defs>

  <!-- Crisp light porcelain card with accessible slate rim -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#ctrlSurface)" stroke="#94a3b8" stroke-width="2" />

  <!-- Top slider track + Cerulean Teal active segment + thumb -->
  <rect x="14" y="18" width="36" height="5" rx="2.5" fill="#cbd5e1" />
  <rect x="14" y="18" width="18" height="5" rx="2.5" fill="#0e7490" />
  <circle cx="33" cy="20.5" r="5" fill="#ffffff" stroke="#0e7490" stroke-width="2.5" />

  <!-- Middle slider track + Slate thumb -->
  <rect x="14" y="30" width="36" height="5" rx="2.5" fill="#cbd5e1" />
  <rect x="14" y="30" width="11" height="5" rx="2.5" fill="#475569" />
  <circle cx="24" cy="32.5" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />

  <!-- Bottom slider track + Cerulean Teal active segment + thumb -->
  <rect x="14" y="42" width="36" height="5" rx="2.5" fill="#cbd5e1" />
  <rect x="14" y="42" width="26" height="5" rx="2.5" fill="#0e7490" />
  <circle cx="41" cy="44.5" r="5" fill="#ffffff" stroke="#0e7490" stroke-width="2.5" />
</svg>

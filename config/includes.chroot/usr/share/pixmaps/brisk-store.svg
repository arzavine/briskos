<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background / Drop Shadow Filter -->
    <filter id="storeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Handle Gradient: Ice Cyan (#38bdf8) to Slate (#64748b) -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Handle Inner Highlight -->
    <linearGradient id="handleInnerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Bag Body Gradient: Deep Midnight Slate -->
    <linearGradient id="bagBodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Top Rim Frosted Glass Gradient -->
    <linearGradient id="frostedRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="specularOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Ambient Cyan Glow -->
    <radialGradient id="centerCyanBloom" cx="50%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Unified Supersonic Frost Gradient: 4-Stop System Identity -->
    <!-- Stop 0%: Frost White #ffffff (specular highlight tip) -->
    <!-- Stop 30%: Ice Cyan #38bdf8 (core glow identity) -->
    <!-- Stop 70%: Electric Sky #0284c7 (aerodynamic body) -->
    <!-- Stop 100%: Deep Cobalt Sapphire #1d4ed8 (base foundation) -->
    <linearGradient id="supersonicFrostGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="featherGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="featherGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <linearGradient id="featherGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="spineGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Ambient Outer Cyan Glow around Tote -->
  <circle cx="256" cy="300" r="190" fill="url(#centerCyanBloom)"/>

  <!-- Tote Bag Handle Loop (Behind bag body top) -->
  <g id="handle">
    <!-- Outer Handle Arc -->
    <path d="M 180 160 C 180 84, 332 84, 332 160"
          fill="none"
          stroke="url(#handleGrad)"
          stroke-width="18"
          stroke-linecap="round"/>
    <!-- Handle Frosted Highlight -->
    <path d="M 183 158 C 183 89, 329 89, 329 158"
          fill="none"
          stroke="url(#handleInnerHighlight)"
          stroke-width="4"
          stroke-linecap="round"/>
  </g>

  <!-- Tote Bag Body Container with Shadow -->
  <g id="bagBody" filter="url(#storeShadow)">
    <!-- Main Tote Body: Sleek tapered tech silhouette -->
    <!-- Top width: 248px (x=132 to x=380), Bottom width: 298px (x=94 to x=418), Height: 296px (y=144 to y=440) -->
    <path d="M 132 144 
             L 380 144 
             C 388 144, 394 150, 396 158
             L 418 406
             C 420 422, 408 438, 392 440
             L 120 440
             C 104 438, 92 422, 94 406
             L 116 158
             C 118 150, 124 144, 132 144 Z"
          fill="url(#bagBodyGrad)"
          stroke="#1e293b"
          stroke-width="2.5"/>

    <!-- Subtle Frosted Glass Surface Specular Overlay -->
    <path d="M 132 144 
             L 380 144 
             C 388 144, 394 150, 396 158
             L 418 406
             C 420 422, 408 438, 392 440
             L 120 440
             C 104 438, 92 422, 94 406
             L 116 158
             C 118 150, 124 144, 132 144 Z"
          fill="url(#specularOverlay)"/>

    <!-- Subtle Aerodynamic Facet Seams on Bag Face -->
    <path d="M 134 156 L 195 436"
          stroke="#38bdf8"
          stroke-width="1.2"
          stroke-opacity="0.08"/>
    <path d="M 378 156 L 317 436"
          stroke="#38bdf8"
          stroke-width="1.2"
          stroke-opacity="0.08"/>

    <!-- Top Fold Rim (Frosted Glass Rim) -->
    <path d="M 124 144 L 388 144 C 394 144, 398 148, 398 154 L 396 166 C 396 170, 392 174, 388 174 L 124 174 C 120 174, 116 170, 116 166 L 114 154 C 114 148, 118 144, 124 144 Z"
          fill="#1e293b"
          fill-opacity="0.85"
          stroke="url(#frostedRimGrad)"
          stroke-width="1.5"/>

    <!-- Handle Fastener Anchors / Rivets on Top Rim -->
    <rect x="172" y="150" width="16" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="180" cy="160" r="3" fill="#38bdf8"/>

    <rect x="324" y="150" width="16" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="332" cy="160" r="3" fill="#38bdf8"/>
  </g>

  <!-- Centered Aerodynamic BriskOS Feather/Wing Emblem -->
  <!-- Scaled and centered at (256, 305) -->
  <g id="briskEmblem" transform="translate(14, 15) scale(0.95)">
    <!-- Ambient Core Bloom behind wings -->
    <circle cx="256" cy="300" r="95" fill="url(#centerCyanBloom)"/>

    <!-- Concentric Flow Streamlines -->
    <path d="M 140 375 C 195 355, 275 285, 345 190" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 160 398 C 215 378, 295 308, 360 215" 
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.2"/>

    <!-- Feather / Wing Layer 3 (Lower Trailing Vane) -->
    <path d="M 175 375 C 205 368, 245 350, 285 315 L 255 302 C 220 330, 190 352, 175 375 Z"
          fill="url(#featherGrad3)"/>

    <!-- Feather / Wing Layer 2 (Mid-Span Compression Vane) -->
    <path d="M 200 345 C 240 322, 295 285, 335 238 L 300 228 C 262 265, 218 310, 200 345 Z"
          fill="url(#featherGrad2)"/>

    <!-- Feather / Wing Layer 1 (Forward Supersonic Blade) -->
    <path d="M 235 305 C 282 265, 338 215, 375 155 L 338 165 C 298 210, 250 260, 235 305 Z"
          fill="url(#featherGrad1)"/>

    <!-- Main Primary Swept Aerodynamic Wing Delta -->
    <path d="M 155 388 C 192 355, 260 272, 375 152 C 360 192, 330 278, 275 332 C 235 372, 180 392, 155 388 Z"
          fill="url(#featherGrad1)" fill-opacity="0.95"/>

    <!-- Feather Spine / Supersonic Chine Spar -->
    <path d="M 145 398 C 190 358, 270 270, 388 142"
          fill="none" stroke="url(#spineGlow)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Aerodynamic Caliber Slots (Vane Separation) -->
    <line x1="275" y1="242" x2="318" y2="265" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="238" y1="282" x2="275" y2="305" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="328" x2="232" y2="348" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Apex Luminous Node -->
    <circle cx="388" cy="142" r="3.5" fill="#ffffff"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Drop Shadow for Desktop Icon Glass Elevation -->
    <filter id="controlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Deep Night Glass Chassis Gradient -->
    <linearGradient id="nightGlassBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="40%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glass Rim Border with Specular Top Incident Light -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.60"/>
    </linearGradient>

    <!-- Inner Frosted Specular Sheen -->
    <linearGradient id="innerSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Central Aperture Chamber Ambient Bloom -->
    <radialGradient id="apertureBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Unified Supersonic Frost Gradient: 4-Stop System Identity -->
    <!-- Stop 0%: Frost White #ffffff (specular highlight tip) -->
    <!-- Stop 30%: Ice Cyan #38bdf8 (core glow identity) -->
    <!-- Stop 70%: Electric Sky #0284c7 (aerodynamic body) -->
    <!-- Stop 100%: Deep Cobalt Sapphire #1d4ed8 (base foundation) -->
    <linearGradient id="supersonicFrostGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Feather Blade Layer 1 & Primary Delta -->
    <linearGradient id="featherGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Feather Mid-Span Compression Vane Layer 2 -->
    <linearGradient id="featherGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Feather Lower Trailing Vane Layer 3 -->
    <linearGradient id="featherGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Supersonic Chine Spar / Spine Glow -->
    <linearGradient id="spineGlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Apex Specular Flare -->
    <radialGradient id="apexSpecularFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night Glass Squircle Chassis with Elevation Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="26" 
        fill="url(#nightGlassBase)" 
        stroke="url(#glassBorder)" 
        stroke-width="1.2" 
        filter="url(#controlShadow)"/>

  <!-- Inner Frosted Specular Sheen (Top Incident Glint) -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="24.5" 
        fill="none" 
        stroke="url(#innerSheen)" 
        stroke-width="1"/>

  <!-- Ambient Ice Cyan Aperture Bloom -->
  <circle cx="64" cy="64" r="48" fill="url(#apertureBloom)"/>

  <!-- AERODYNAMIC COMMAND APERTURE -->
  <!-- Outer Bezel Precision Track (R=46) -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Aperture Iris Vane Brackets (4 Aerodynamic Caliper Stops) -->
  <path d="M 46.5 21.5 A 46 46 0 0 1 81.5 21.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 106.5 46.5 A 46 46 0 0 1 106.5 81.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 81.5 106.5 A 46 46 0 0 1 46.5 106.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 21.5 81.5 A 46 46 0 0 1 21.5 46.5" fill="none" stroke="#1e293b" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Precision Telemetry Index Ticks -->
  <!-- 4 Primary Cardinal Index Marks -->
  <line x1="105.5" y1="64.0" x2="110.0" y2="64.0" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="64.0" y1="105.5" x2="64.0" y2="110.0" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="22.5" y1="64.0" x2="18.0" y2="64.0" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="64.0" y1="22.5" x2="64.0" y2="18.0" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 8 Secondary Calibration Ticks -->
  <line x1="101.24" y1="85.5" x2="103.84" y2="87.0" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="85.5" y1="101.24" x2="87.0" y2="103.84" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42.5" y1="101.24" x2="41.0" y2="103.84" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26.76" y1="85.5" x2="24.16" y2="87.0" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="26.76" y1="42.5" x2="24.16" y2="41.0" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42.5" y1="26.76" x2="41.0" y2="24.16" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="85.5" y1="26.76" x2="87.0" y2="24.16" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="101.24" y1="42.5" x2="103.84" y2="41.0" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Concentric Orbital Telemetry Ring (R=41) -->
  <circle cx="64" cy="64" r="41" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2 4"/>

  <!-- Active Telemetry Command Track & Arc (R=36) -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-opacity="0.9" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Active Dynamic Sweep Arc (Supersonic Frost Gradient: 145 deg -> 325 deg) -->
  <path d="M 34.52 84.65 A 36 36 0 0 1 93.49 43.35" 
        fill="none" 
        stroke="url(#supersonicFrostGrad)" 
        stroke-width="3.2" 
        stroke-linecap="round"/>

  <!-- Active Telemetry Level Node at Upper-Right (325 deg) -->
  <circle cx="93.49" cy="43.35" r="2.2" fill="#ffffff"/>
  <circle cx="93.49" cy="43.35" r="4.2" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Inner Collimator Guide Ring (R=27) -->
  <circle cx="64" cy="64" r="27" fill="none" stroke="#1e293b" stroke-width="0.9" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="27" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="1 5"/>

  <!-- Precision Control Center Telemetry Sliders / Level Indicators (Upper-Left Aperture) -->
  <line x1="32" y1="37" x2="44" y2="37" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75"/>
  <circle cx="41" cy="37" r="1.4" fill="#ffffff"/>
  <line x1="29" y1="41" x2="39" y2="41" stroke="#0284c7" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle cx="35" cy="41" r="1.2" fill="#38bdf8"/>
  <line x1="27" y1="45" x2="35" y2="45" stroke="#1d4ed8" stroke-width="1.0" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Aerodynamic Streamlines Curving Along Flight Vector -->
  <path d="M 29.35 90.00 C 45.85 85.05, 70.60 65.25, 92.05 37.20" 
        fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.28"/>
  <path d="M 35.95 96.60 C 52.45 91.65, 77.20 71.85, 96.18 43.80" 
        fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.18"/>

  <!-- SWEPT FEATHER DIAL GLYPH (Signature Brisk Aero Needle) -->
  <g id="featherDial">
    <!-- Feather Layer 3 (Lower Trailing Vane) -->
    <path d="M 39.25 89.99 C 47.50 88.34, 59.05 83.39, 69.78 74.31 L 62.35 71.02 C 52.45 78.44, 44.20 84.22, 39.25 89.99 Z"
          fill="url(#featherGrad3)"/>

    <!-- Feather Layer 2 (Mid-Span Compression Vane) -->
    <path d="M 46.67 82.56 C 57.40 76.79, 72.25 67.72, 82.15 56.17 L 73.08 53.69 C 63.17 62.77, 51.62 73.49, 46.67 82.56 Z"
          fill="url(#featherGrad2)"/>

    <!-- Feather Layer 1 (Forward Supersonic Blade) -->
    <path d="M 55.75 72.67 C 68.12 62.77, 82.98 50.39, 92.88 35.54 L 82.98 38.02 C 72.25 48.74, 59.88 61.11, 55.75 72.67 Z"
          fill="url(#featherGrad1)"/>

    <!-- Main Primary Swept Aerodynamic Wing Delta -->
    <path d="M 34.30 93.29 C 44.20 85.04, 62.35 65.24, 92.88 34.72 C 88.75 44.62, 80.50 66.06, 66.48 79.27 C 55.75 89.17, 41.73 94.12, 34.30 93.29 Z"
          fill="url(#featherGrad1)" fill-opacity="0.95"/>

    <!-- Feather Spine / Supersonic Chine Spar -->
    <path d="M 31.82 95.77 C 43.38 85.87, 64.83 64.42, 96.18 32.24"
          fill="none" stroke="url(#spineGlow)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Aerodynamic Caliber Slots (Precision Vane Separation) -->
    <line x1="66.48" y1="56.99" x2="78.03" y2="62.77" stroke="#0b0f19" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="56.58" y1="66.89" x2="66.48" y2="72.67" stroke="#0b0f19" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="46.67" y1="78.44" x2="54.92" y2="83.06" stroke="#0b0f19" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Apex Specular Flare & Luminous Node -->
    <circle cx="96.18" cy="32.24" r="4.0" fill="url(#apexSpecularFlare)"/>
    <circle cx="96.18" cy="32.24" r="1.3" fill="#ffffff"/>
  </g>

  <!-- CENTRAL COMMAND APERTURE GIMBAL HUB -->
  <!-- Outer Gimbal Bearing Ring (R=10) -->
  <circle cx="64" cy="64" r="9.5" fill="#0b0f19" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.1"/>

  <!-- Gimbal Calibration Markings (R=7) -->
  <circle cx="64" cy="64" r="7" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.35" stroke-dasharray="1.5 2.5"/>

  <!-- Core Precision Gimbal Jewel & Axis -->
  <circle cx="64" cy="64" r="4.5" fill="#0f172a" stroke="url(#supersonicFrostGrad)" stroke-width="1.1"/>
  <circle cx="64" cy="64" r="2.2" fill="#38bdf8"/>
  <circle cx="64" cy="64" r="0.9" fill="#ffffff"/>
</svg>
